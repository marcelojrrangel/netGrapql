server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: graphql_api_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: graphql_api
          app: api
          role: receptor
          environment: development
          __path__: /var/log/graphql/*.log

  - job_name: graphql_console_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: graphql_console
          app: console
          role: caller
          environment: development
          __path__: /var/log/graphql-console/*.log
